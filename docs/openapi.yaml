openapi: 3.1.0
info:
  title: Sentinel API
  version: 0.1.0
  description: Contrato inicial; endpoints funcionais serão detalhados por fase.
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      operationId: healthLive
      responses:
        "200":
          description: Processo ativo
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: healthReady
      responses:
        "200":
          description: PostgreSQL disponível e serviço pronto para receber tráfego
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Dependência necessária indisponível
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  headers:
    RequestId:
      description: UUID de correlação validado ou gerado pelo servidor.
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: sentinel-api }
    ProblemDetails:
      type: object
      required: [type, title, status, code, correlation_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        correlation_id: { type: string, format: uuid }
